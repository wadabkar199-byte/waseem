name: waseem
description: منصة وسيم (WASEEM) - منصة حجز الحلاقة الذكية والعناية بالرجال
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management & Routing
  flutter_bloc: ^8.1.3
  go_router: ^14.2.0

  # Supabase & Backend Services
  supabase_flutter: ^2.5.6

  # Networking & Storage
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1

  # UI & Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
