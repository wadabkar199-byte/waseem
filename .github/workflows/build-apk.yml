name: Build Waseem Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Recreate Android Project Configuration
        working-directory: ./mobile
        run: |
          flutter config --enable-android
          flutter create . --platform=android --org=com.waseem

      - name: Fix Subprojects compileSdkVersion in build.gradle
        working-directory: ./mobile/android
        run: |
          cat << 'EOF' >> build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdkVersion 34
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build APK (Release Mode)
        working-directory: ./mobile
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waseem-App-Release-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
